version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/processor"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/enabler"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10