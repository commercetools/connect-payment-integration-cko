deployAs:
  - name: enabler
    applicationType: assets
  - name: processor
    applicationType: service
    endpoint: /
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools client ID with manage_payments, manage_orders, view_sessions, view_api_clients, manage_checkout_payment_intents, introspect_oauth_tokens, manage_types and view_types scopes
          required: true
        - key: CTP_AUTH_URL
          description: commercetools Auth URL
          required: true
          default: https://auth.europe-west1.gcp.commercetools.com
        - key: CTP_API_URL
          description: commercetools API URL
          required: true
          default: https://api.europe-west1.gcp.commercetools.com
        - key: CTP_SESSION_URL
          description: Session API URL
          required: true
          default: https://session.europe-west1.gcp.commercetools.com
        - key: CTP_CHECKOUT_URL
          description: Checkout API URL (example - https://checkout.europe-west1.gcp.commercetools.com).
          required: true
          default: https://checkout.europe-west1.gcp.commercetools.com
        - key: CTP_JWKS_URL
          description: JWKs url (example - https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json)
          required: true
          default: https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json
        - key: CTP_JWT_ISSUER
          description: JWT Issuer for jwt validation (example - https://mc-api.europe-west1.gcp.commercetools.com)
          required: true
          default: https://mc-api.europe-west1.gcp.commercetools.com
        - key: HEALTH_CHECK_TIMEOUT
          description: Health check timeout in milliseconds
          required: false
          default: '5000'
        - key: LOGGER_LEVEL
          description: Log level (trace, debug, info, warn, error, fatal)
          required: false
          default: 'info'
        - key: MERCHANT_RETURN_URL
          description: Post-payment redirect URL to return customers to merchant site
          required: true
        - key: CKO_ENVIRONMENT
          description: Checkout.com environment (sandbox or production)
          required: true
      securedConfiguration:
        - key: CTP_CLIENT_SECRET
          description: commercetools client secret
          required: true
        - key: CKO_CONFIG
          description: JSON configuration for Checkout.com channels including API keys, secrets, and channel settings. Each channel accepts an optional clientId (Checkout.com client ID, cli_...) used to derive the merchant-specific hosts (MSSD, required for Checkout.com clients created on or after 2026-10-01) and optional apiBaseUrl/accessBaseUrl overrides. Without clientId the shared Checkout.com hosts are used
          required: true
