<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to commercestore...</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .container {
        text-align: center;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid white;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      a {
        color: white;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h2>Redirecting to commercestore...</h2>
      <p>If you are not redirected automatically, <a href="/dev-utils/commercestore/">click here</a>.</p>
    </div>
    <script>
      // Preserve query parameters during redirect
      const queryString = window.location.search;
      const redirectUrl = '/dev-utils/commercestore/' + queryString;
      
      // Fallback redirect in case meta refresh doesn't work
      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 100);
    </script>
  </body>
</html>
